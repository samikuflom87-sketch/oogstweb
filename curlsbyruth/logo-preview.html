<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<title>CurlsbyRuth — logo preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
    background: #F7F1EA;
    font-family: system-ui, sans-serif;
    padding: 40px;
  }
  .card {
    background: #fff;
    padding: 40px 60px;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(59,42,34,.08);
  }
  .dark {
    background: #3B2A22;
  }
  img { width: 320px; height: auto; display: block; }
  .dark img { filter: brightness(0) invert(1); }
  p { color: #7A6A5E; font-size: 13px; margin-top: 12px; text-align: center; }
</style>
</head>
<body>
  <div class="card"><img src="logo.svg" alt="CurlsbyRuth logo"></div>
  <div class="card dark"><img src="logo.svg" alt="CurlsbyRuth logo op donkere achtergrond"></div>
  <p>Placeholder logo — kan later vervangen worden door het echte logo van de klant.</p>
</body>
</html>
